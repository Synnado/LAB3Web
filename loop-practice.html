<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฝึกเขียน Loop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .control-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        input[type="number"] {
            padding: 9px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 180px;
        }
        button {
            background-color: #26b6f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0288d1;
        }
        #output {
            background-color: #111111;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.5;
            max-width: 400px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div class="control-box">
        <input type="number" id="maxInput" min="0" placeholder="กรอกค่า maxNumber" value="15">
        <button onclick="runLoop()">Run Code</button>
    </div>

    <div id="output"></div>

    <script>
        function runLoop() {
            let inputVal = document.getElementById("maxInput").value;
            if (inputVal === "" || Number(inputVal) < 0) {
                document.getElementById("output").innerText = "กรุณากรอกตัวเลขตั้งแต่ 0 ขึ้นไป";
                return;
            }

            let maxNumber = Number(inputVal);
            let resultText = "";

            console.clear();

            for (let i = 0; i <= maxNumber; i++) {
                let line = (i % 2 === 0) ? `${i} (คู่)` : `${i} (คี่)`;
                resultText += line + "\n";
                console.log(line);
            }

            for (let i = 0; i <= maxNumber; i += 2) {
                let line = `นับทีละ 2: ${i}`;
                resultText += line + "\n";
                console.log(line);
            }

            for (let i = 10; i >= 0; i--) {
                let line = `ถอยหลัง: ${i}`;
                resultText += line + "\n";
                console.log(line);
            }

            document.getElementById("output").innerText = resultText;
        }

        runLoop();
    </script>

</body>
</html>
